<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Iolaus — Verified State Transitions</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;background:#0b0d10;color:#e8eef4}
main{max-width:1200px;margin:0 auto;padding:28px}
h1{font-size:28px;margin-bottom:6px}
.sub{color:#9fb0bf;margin-bottom:24px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{background:#171c22;color:#e8eef4;border:1px solid #39434d;padding:9px 12px;border-radius:7px;cursor:pointer}
button:hover{background:#202832}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid #303944;border-radius:10px;background:#11151a;overflow:hidden}
.head{padding:12px 14px;border-bottom:1px solid #303944;font-weight:700}
.log{padding:12px;min-height:430px}
.event{padding:8px 10px;border-left:3px solid #5c6875;margin:7px 0;background:#151a20;border-radius:3px}
.event.good{border-left-color:#57c785}.event.bad{border-left-color:#ff6470}.event.warn{border-left-color:#f0c25c}
.phase{display:inline-block;width:82px;color:#8ba1b4;font-weight:700}
.metrics{margin-top:16px;border:1px solid #303944;border-radius:10px;padding:14px;background:#11151a}
pre{white-space:pre-wrap}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Iolaus</h1>
<div class="sub">Same plan. Same fault. Same target. The only difference: whether success must be verified.</div>
<div class="controls" id="controls"></div>
<div class="grid">
  <div class="card"><div class="head">BASELINE AGENT — trusts tool output</div><div class="log" id="baseline"></div></div>
  <div class="card"><div class="head">VERIFIED AGENT — postcondition gate</div><div class="log" id="verified"></div></div>
</div>
<div class="metrics">
  <button onclick="runSuite()">Run 200 paired trials</button>
  <pre id="metrics">Benchmark summary will appear here.</pre>
</div>
</main>
<script>
function addEvent(el,e){
  const d=document.createElement('div');
  d.className='event '+(e.tone||'');
  d.innerHTML='<span class="phase">'+e.phase+'</span>'+e.message;
  el.appendChild(d);
}
async function animate(el,events){
  el.innerHTML='';
  for(const e of events){addEvent(el,e);await new Promise(r=>setTimeout(r,240));}
}
async function runScenario(id){
  const r=await fetch('/api/run/'+encodeURIComponent(id),{method:'POST'});
  const x=await r.json();
  animate(document.getElementById('baseline'),x.baseline.timeline);
  animate(document.getElementById('verified'),x.verified.timeline);
}
async function load(){
  const xs=await (await fetch('/api/scenarios')).json();
  const c=document.getElementById('controls');
  for(const s of xs){
    const b=document.createElement('button'); b.textContent=s.id; b.onclick=()=>runScenario(s.id); c.appendChild(b);
  }
}
async function runSuite(){
  const el=document.getElementById('metrics'); el.textContent='running...';
  const x=await (await fetch('/api/suite',{method:'POST'})).json();
  el.textContent=JSON.stringify(x,null,2);
}
load();
</script>
</body>
</html>
