[workspace]
resolver = "2"
members = [
  "crates/iolaus-core",
  "crates/iolaus-hydra",
  "crates/iolaus-bench",
  "crates/iolaus-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Tom Prior"]
repository = "https://github.com/prx0r/Iolaus"

[workspace.dependencies]
anyhow = "=1.0.93"
async-trait = "=0.1.83"
axum = { version = "=0.7.9", features = ["json"] }
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
clap = { version = "=4.5.21", features = ["derive", "env"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
hex = "=0.4.3"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
statrs = "=0.17.1"
tokio = { version = "=1.41.1", features = ["full"] }
toml = "=0.8.19"
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
